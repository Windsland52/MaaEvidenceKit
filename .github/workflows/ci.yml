name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MAA_EVIDENCE_TELEMETRY: "0"
    strategy:
      fail-fast: false
      matrix:
        # 22.12.0 is the oldest supported version: running it here is what stops a Node
        # 22-incompatible API from reaching a user's install, and it is the oldest patch that
        # `@sentry/node` 11 accepts within Node 22. 24 keeps coverage on the current major.
        node: ["22.12.0", "24"]

    name: Node.js ${{ matrix.node }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}

      - name: Install locked dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Run release checks
        run: pnpm release:check
