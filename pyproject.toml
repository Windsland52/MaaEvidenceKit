[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "maa-diagnostic-expert"
version = "0.1.0"
description = "Python-first diagnostic agent for Maa projects"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
authors = [{ name = "Windsland52" }]
dependencies = [
  "pydantic>=2.12,<3",
]

[project.optional-dependencies]
agent = [
  "langchain-core>=1,<2",
  "langgraph>=1,<2",
]

[project.scripts]
maa-diagnostic-expert = "maa_diagnostic_expert.cli:main"
maa-generate-contracts = "maa_diagnostic_expert.contracts:main"

[dependency-groups]
dev = [
  "pyright>=1.1.400",
  "pytest>=8,<10",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/maa_diagnostic_expert"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
line-ending = "lf"

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
